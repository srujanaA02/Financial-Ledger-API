version: "3.9"

services:
  db:
    image: postgres:16
    container_name: ledger_db
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_pass
      POSTGRES_DB: financial_ledger
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d financial_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ledger_api
    environment:
      DATABASE_URL: postgresql://ledger_user:ledger_pass@db:5432/financial_ledger
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
